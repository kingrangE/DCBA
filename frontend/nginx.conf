server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://dcba-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/api/exercises/[^/]+/review-feedback/?$ {
            client_max_body_size 16k;
            proxy_pass http://dcba-app:8080;
            proxy_read_timeout 20s;
            error_page 413 = @review_body_too_large;
        }
    }

    location @review_body_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"message":"답변 요청의 크기가 너무 커요.","status":413,"timestamp":"$time_iso8601"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
