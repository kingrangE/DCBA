name: DCBA EC2 Release

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "DCBA/**"
      - "LLM-Server/**"
      - ".github/workflows/**"
      - "docker-compose*.yml"
      - "scripts/deploy-ec2.sh"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ec2-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend-ci-cd.yml
    secrets: inherit
  java:
    uses: ./.github/workflows/java-ci-cd.yml
    secrets: inherit
  python:
    uses: ./.github/workflows/python-ci-cd.yml
    secrets: inherit
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DCBA_EC2_ROLE_ARN != '' && vars.DCBA_EC2_INSTANCE_ID != ''
    needs: [frontend, java, python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.DCBA_EC2_INSTANCE_ID }}
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.DCBA_EC2_ROLE_ARN }}
      - name: Deploy and check the web API
        run: |
          jq -n --arg sha "$GITHUB_SHA" --rawfile script scripts/deploy-ec2.sh \
            '{commands: ["bash -s -- " + $sha + " <<\u0027DCBA_DEPLOY\u0027\n" + $script + "\nDCBA_DEPLOY"]}' > "$RUNNER_TEMP/dcba-ssm.json"
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" --parameters "file://$RUNNER_TEMP/dcba-ssm.json" \
            --query 'Command.CommandId' --output text)
          for _ in {1..90}; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null) || status=Pending
            case "$status" in
              Success) echo "EC2 deployment succeeded"; exit 0 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "::error::SSM deployment $command_id ended with $status"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for SSM deployment $command_id"
          exit 1
