name: Python CI/CD

on:
  push:
    branches: ["main", "LLM-Server"]
    paths:
      - "LLM-Server/**"
      - ".github/workflows/python-ci-cd.yml"
      - "!LLM-Server/**/*.md"
  pull_request:
    branches: ["main", "review/**"]
    paths:
      - "LLM-Server/**"
      - ".github/workflows/python-ci-cd.yml"
      - "!LLM-Server/**/*.md"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12

  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./LLM-Server
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13 Setting
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up uv and dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'LLM-Server/requirements*.txt'
      - name: Install Packages
        run: uv pip install --system --torch-backend cpu -r requirements-test.txt
      - name: Execute Test
        env: #환경 변수 에러 방지용 빈 값 (사용하지 않을 것이기에 값이 필요 없음)
          OPENAI_API_KEY: "key"
          KANANA_MODEL_NAME: "kakaocorp/kanana-2-3b-instruct"
          DEDUPLICATION_ENABLED: "false"
          CHROMA_PERSIST_DIRECTORY: ${{ runner.temp }}/chroma-ci
        run: python -m pytest tests

  python-cd:
    needs: [lint, python-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # main에 push일 때만 CD 수행
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Get Version 
        id: get_version
        run: |
          VERSION=$(cat LLM-Server/VERSION)
          {
            echo "VERSION=$VERSION"
            echo "MAJOR=$(echo "$VERSION" | cut -d. -f1)"
            echo "MINOR=$(echo "$VERSION" | cut -d. -f1,2)"
          } >> "$GITHUB_ENV"
      - name: Build and push Python App Image
        uses: docker/build-push-action@v6
        with:
          context: ./LLM-Server
          file: ./LLM-Server/Dockerfile
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-llm-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-llm-server:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-llm-server:${{ env.MINOR }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-llm-server:${{ env.MAJOR }}
