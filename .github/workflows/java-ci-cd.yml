name: Java CI/CD

on:
  workflow_call:
  push:
    branches: ["JavaApp"]
    paths:
      - "DCBA/**"
      - "LLM-Server/app/migrate.py"
      - "LLM-Server/migrations/**"
      - ".github/workflows/java-ci-cd.yml"
      - "!DCBA/**/*.md"
  pull_request:
    branches: ["main", "review/**"]
    paths:
      - "DCBA/**"
      - "LLM-Server/app/migrate.py"
      - "LLM-Server/migrations/**"
      - ".github/workflows/java-ci-cd.yml"
      - "!DCBA/**/*.md"
concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow syntax
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12

  java-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./DCBA
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=3
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: 1234
          MARIADB_DATABASE: test_maria
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: JDK(21) Setting
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant Execution Authority to Gradle
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/test_maria
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1234
          SPRING_JPA_HIBERNATE_DDL_AUTO: create
          REVIEW_TEST_REDIS_PORT: 6379
        run: ./gradlew test --rerun bootJar --build-cache
      - name: Test the migrated MariaDB search index
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: '1234'
          MARIADB_DATABASE: test_search_index
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/test_search_index
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: '1234'
          SEARCH_INDEX_INTEGRATION_TEST: 'true'
        run: |
          db() { docker exec -e MYSQL_PWD="$MARIADB_PASSWORD" "$MARIADB_CONTAINER" mariadb -uroot --default-character-set=utf8mb4 "$@"; }
          db -e 'CREATE DATABASE test_search_index CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci'
          python3 -m venv "$RUNNER_TEMP/dcba-migrate"
          migrate_python="$RUNNER_TEMP/dcba-migrate/bin/python"
          "$migrate_python" -m pip install pymysql
          (
            cd ../LLM-Server
            "$migrate_python" -m app.migrate
            db "$MARIADB_DATABASE" -e "INSERT INTO exercise (subject, level, question, answer) VALUES ('OPERATING_SYSTEM', 'MEDIUM', '교착 상태 기존 문항', '해설')"
            "$migrate_python" -m app.migrate --search-index
          )
          ./gradlew test --tests '*MigratedSearchIndexTests'
      - name: Keep the tested application
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: DCBA/build/libs/app.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  java-cd:
    needs: [lint, java-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get the tested application
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: .ci-java
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep "version =" DCBA/build.gradle | awk -F"'" '{print $2}')
          {
            echo "VERSION=$VERSION"
            echo "MAJOR=$(echo "$VERSION" | cut -d. -f1)"
            echo "MINOR=$(echo "$VERSION" | cut -d. -f1,2)"
          } >> "$GITHUB_ENV"
      - name: Build and push Java App Image
        uses: docker/build-push-action@v6
        with:
          context: ./.ci-java
          file: ./DCBA/Dockerfile
          target: ci
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=java
          cache-to: type=gha,mode=max,scope=java
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-java-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-java-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-java-app:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-java-app:${{ env.MINOR }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dcba-java-app:${{ env.MAJOR }}
