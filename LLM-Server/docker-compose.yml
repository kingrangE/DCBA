# Reuse the root deployment contract while running only the generation stack.
services:
  llm-server:
    extends:
      file: ../docker-compose.yml
      service: llm-server
    profiles: []
    build:
      context: .
  schema-migrate:
    extends:
      file: ../docker-compose.yml
      service: schema-migrate
    build:
      context: .
      target: migration
  redis:
    extends:
      file: ../docker-compose.yml
      service: redis
  mariadb:
    extends:
      file: ../docker-compose.yml
      service: mariadb
volumes:
  redis_data:
  mariadb_data:
  huggingface_cache:
  chroma_data:
networks:
  dcba-network:
    driver: bridge
