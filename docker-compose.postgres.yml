# Apply after the base compose file. Enable on a host after the verified import.
services:
  mariadb:
    profiles: ["maria-rollback"]

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcba}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_USER:-dcba}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
    command: ["postgres", "-c", "random_page_cost=1.1", "-c", "effective_cache_size=512MB", "-c", "jit=off", "-c", "timezone=UTC"]
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/001-dcba-role.sql:ro
    networks:
      - dcba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_APP_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  schema-migrate:
    environment: &postgres-env
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dcba}
      POSTGRES_USER: ${POSTGRES_USER:-dcba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DCBA_REQUIRE_POSTGRES_IMPORT: ${DCBA_REQUIRE_POSTGRES_IMPORT:-0}
    depends_on: !override
      postgres:
        condition: service_healthy

  llm-server:
    environment: *postgres-env
    depends_on: !override
      schema-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dcba-app:
    environment:
      <<: *postgres-env
      SPRING_PROFILES_ACTIVE: prod,postgres
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    depends_on: !override
      schema-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
