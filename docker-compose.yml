services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kingrange/dcba-frontend:latest
    container_name: dcba-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - dcba-app
    networks:
      - dcba-network
    restart: always

  llm-server:
    profiles: ["llm"]
    build:
      context: ./LLM-Server
      dockerfile: Dockerfile
    image: kingrange/dcba-llm-server:latest
    container_name: llm-server
    ports:
      - "${LLM_SERVER_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=${MARIADB_USER:-dcba}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-dcba_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-dcba}
      - KANANA_MODEL_NAME=${KANANA_MODEL_NAME:-kakaocorp/kanana-2-3b-instruct}
      - KANANA_DEVICE_MAP=${KANANA_DEVICE_MAP:-auto}
      - KANANA_MAX_NEW_TOKENS=${KANANA_MAX_NEW_TOKENS:-512}
      - KANANA_TEMPERATURE=${KANANA_TEMPERATURE:-0.2}
      - KANANA_TOP_P=${KANANA_TOP_P:-0.9}
      - HF_HOME=/home/appuser/.cache/huggingface
      - DEDUPLICATION_ENABLED=${DEDUPLICATION_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - dcba-network
    restart: always

  dcba-app:
    build:
      context: ./DCBA
      dockerfile: Dockerfile
    image: kingrange/dcba-java-app:latest
    container_name: dcba-app
    ports:
      - "${DCBA_SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=${MARIADB_USER:-dcba}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-dcba_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-dcba}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - dcba-network
    restart: always

  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "${EXTERNAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dcba-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  mariadb:
    image: mariadb:10.11
    container_name: mariadb-server
    ports:
      - "${EXTERNAL_MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dcba_root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dcba}
      MARIADB_USER: ${MARIADB_USER:-dcba}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dcba_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dcba-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - dcba-network
    restart: always

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dcba-network
    restart: always

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - dcba-network
    restart: always

volumes:
  redis_data:
  mariadb_data:
  huggingface_cache:
  prometheus_data:
  grafana_data:

networks:
  dcba-network:
    driver: bridge
